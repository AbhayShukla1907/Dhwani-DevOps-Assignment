name: Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dhwani-devops-assignment:latest \
            -t ghcr.io/${{ github.repository_owner }}/dhwani-devops-assignment:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/dhwani-devops-assignment:latest
          docker push ghcr.io/${{ github.repository_owner }}/dhwani-devops-assignment:${{ github.sha }}

      - name: Start application
        run: |
          echo "DB_ROOT_PASSWORD=testroot123" > .env
          echo "DB_PASSWORD=testpass123" >> .env
          docker compose up -d

      - name: Wait for services
        run: sleep 15

      - name: Check containers
        run: docker compose ps

      - name: Health check
        run: |
          curl --fail http://localhost:8080/health

      - name: Stop services
        if: always()
        run: docker compose down